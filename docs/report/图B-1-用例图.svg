<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="940" viewBox="0 0 1150 940">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1150" height="940" fill="#ffffff"/>

  <text x="575" y="32" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="19" font-weight="bold" fill="#1f2937" text-anchor="middle">知食校园 用例图（图B-1）</text>

  <!-- 系统边界 -->
  <rect x="400" y="60" width="360" height="815" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="580" y="92" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#374151" text-anchor="middle">知食校园（微信小程序）</text>

  <!-- 用例 -->
  <g font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">
    <ellipse cx="580" cy="150" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="155">UC-01 设置/修改个人画像</text>

    <ellipse cx="580" cy="245" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="250">UC-02 维护当日菜单</text>

    <ellipse cx="580" cy="340" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="345">UC-03 查看当日候选菜品</text>

    <ellipse cx="580" cy="435" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="440">UC-04 获取 AI 推荐 Top3</text>

    <ellipse cx="580" cy="530" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="535">UC-05 忌口/过敏提示并确认</text>

    <ellipse cx="580" cy="625" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="630">UC-06 记录今日就餐</text>

    <ellipse cx="580" cy="720" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="725">UC-07 提交就餐反馈</text>

    <ellipse cx="580" cy="815" rx="140" ry="30" fill="#eef4ff" stroke="#2b579a" stroke-width="1.4"/>
    <text x="580" y="820">UC-08 清空个人数据</text>
  </g>

  <!-- 学生参与者 -->
  <g stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="150" cy="418" r="18"/>
    <line x1="150" y1="436" x2="150" y2="492"/>
    <line x1="112" y1="458" x2="188" y2="458"/>
    <line x1="150" y1="492" x2="118" y2="532"/>
    <line x1="150" y1="492" x2="182" y2="532"/>
  </g>
  <text x="150" y="572" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">学生（主要参与者）</text>

  <!-- 关联：学生 → 各用例 -->
  <g stroke="#374151" stroke-width="1.3">
    <line x1="190" y1="458" x2="440" y2="150"/>
    <line x1="190" y1="458" x2="440" y2="245"/>
    <line x1="190" y1="458" x2="440" y2="340"/>
    <line x1="190" y1="458" x2="440" y2="435"/>
    <line x1="190" y1="458" x2="440" y2="530"/>
    <line x1="190" y1="458" x2="440" y2="625"/>
    <line x1="190" y1="458" x2="440" y2="720"/>
    <line x1="190" y1="458" x2="440" y2="815"/>
  </g>

  <!-- LLM 支撑参与者 -->
  <g stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="1010" cy="395" r="18"/>
    <line x1="1010" y1="413" x2="1010" y2="469"/>
    <line x1="972" y1="435" x2="1048" y2="435"/>
    <line x1="1010" y1="469" x2="978" y2="509"/>
    <line x1="1010" y1="469" x2="1042" y2="509"/>
  </g>
  <text x="1010" y="549" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">LLM 服务（支撑参与者）</text>
  <line x1="972" y1="435" x2="720" y2="435" stroke="#374151" stroke-width="1.3"/>

  <!-- 用例之间的关系 -->
  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw)">
    <line x1="580" y1="310" x2="580" y2="277"/>
    <line x1="580" y1="500" x2="580" y2="467"/>
    <line x1="580" y1="690" x2="580" y2="657"/>
  </g>
  <g font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#b45309">
    <text x="592" y="299">«include»</text>
    <text x="592" y="489">«extend»</text>
    <text x="592" y="679">«include»</text>
  </g>

  <!-- 图例 -->
  <text x="60" y="908" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#4b5563">图例：实线 = 参与者与用例的关联；虚线 = 用例之间的 include（包含）/ extend（扩展）关系；方框 = 系统边界。</text>
</svg>
