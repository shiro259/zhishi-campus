<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食遇校园 · 产品信息架构</title>
<!--
  产品信息架构思维导图
  · 纯内联实现，无任何外部依赖（离线可用，答辩现场直接浏览器打开）
  · 支持：点击节点折叠/展开、全部展开、全部收起、适应窗口、滚轮缩放
  · 内容与 pages.json / uniCloud-aliyun/cloudfunctions 逐项对应
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brand: #ff5a36;
    --brand-soft: #fff1ec;
    --ink: #14110f;
    --gray7: #4a443f;
    --gray6: #8a8580;
    --gray4: #b8b2aa;
    --line: #eeece7;
    --surface: #fff;
    --canvas: #f7f6f3;
    --c-user: #2f6df6;
    --c-admin: #7a5af8;
    --c-svc: #1f9d63;
    --c-data: #c98a1b;
    --c-flow: #d93a3a;
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--canvas);
    color: var(--ink);
    overflow: hidden;
  }

  /* ---------------- 顶栏 ---------------- */
  .topbar {
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    position: relative;
    z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .brand-title { font-size: 16px; font-weight: 650; letter-spacing: -.2px; }
  .brand-sub { font-size: 12px; color: var(--gray6); }

  .spacer { flex: 1; }

  .btn {
    height: 34px; padding: 0 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 17px;
    font-size: 13px; color: var(--gray7);
    cursor: pointer;
    transition: .15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 500; }
  .btn.primary:hover { background: #e8481f; border-color: #e8481f; color: #fff; }

  .legend { display: flex; gap: 14px; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gray6); }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; }

  /* ---------------- 画布 ---------------- */
  .stage { position: absolute; inset: 56px 0 0 0; overflow: hidden; cursor: grab; }
  .stage.grabbing { cursor: grabbing; }
  svg { display: block; transform-origin: 0 0; }

  .link { fill: none; stroke: var(--line); stroke-width: 1.6px; }
  .link.c-user { stroke: #cddffd; }
  .link.c-admin { stroke: #ded6fd; }
  .link.c-svc { stroke: #c9ecdb; }
  .link.c-data { stroke: #f3e2c0; }
  .link.c-flow { stroke: #f7d2d2; }

  .node { cursor: pointer; }
  .node-box { rx: 9; ry: 9; }
  .node-label { font-size: 13px; fill: var(--ink); dominant-baseline: middle; }
  .node-label.lv0 { font-size: 19px; font-weight: 700; fill: #fff; }
  .node-label.lv1 { font-size: 15px; font-weight: 650; }
  .node-label.lv2 { font-size: 13px; }
  .node-label.lv3 { font-size: 12px; fill: var(--gray7); }
  .node-label.leaf { cursor: default; }

  .node-count { font-size: 10px; fill: var(--gray4); dominant-baseline: middle; }
  .node-toggle { font-size: 11px; fill: var(--gray4); dominant-baseline: middle; }

  .badge { font-size: 10px; dominant-baseline: middle; fill: #fff; }

  /* 悬浮信息条 */
  .hint {
    position: absolute; left: 20px; bottom: 18px;
    font-size: 12px; color: var(--gray6);
    background: rgba(255,255,255,.92);
    border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px;
    line-height: 1.7;
    pointer-events: none;
  }
  .hint b { color: var(--ink); font-weight: 600; }

  /* 右侧详情抽屉 */
  .aside {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 340px;
    background: var(--surface);
    border-left: 1px solid var(--line);
    transform: translateX(100%);
    transition: transform .22s ease;
    z-index: 9;
    display: flex; flex-direction: column;
  }
  .aside.open { transform: translateX(0); }
  .aside-head {
    height: 56px; padding: 0 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .aside-title { font-size: 15px; font-weight: 650; }
  .aside-close { cursor: pointer; color: var(--gray6); font-size: 20px; line-height: 1; }
  .aside-body { padding: 18px; overflow-y: auto; font-size: 13px; line-height: 1.75; color: var(--gray7); }
  .aside-body h4 { font-size: 13px; color: var(--ink); margin: 16px 0 8px; font-weight: 650; }
  .aside-body h4:first-child { margin-top: 0; }
  .aside-body ul { padding-left: 18px; }
  .aside-body li { margin-bottom: 5px; }
  .aside-body code {
    background: var(--canvas); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; font-size: 12px;
    font-family: ui-monospace, Consolas, monospace; color: var(--brand);
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .tag {
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand); border: 1px solid #ffd9cc;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">食</div>
    <div>
      <div class="brand-title">食遇校园 · 产品信息架构</div>
      <div class="brand-sub">AI 智能食堂推荐</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:var(--c-user)"></span>用户端</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--c-admin)"></span>管理端</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--c-svc)"></span>服务层</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--c-data)"></span>数据层</span>
    <span class="legend-item"><span class="legend-dot" style="background:var(--c-flow)"></span>任务流</span>
  </div>

  <button class="btn" onclick="expandAll()">全部展开</button>
  <button class="btn" onclick="collapseAll()">全部收起</button>
  <button class="btn primary" onclick="fitView()">适应窗口</button>
</div>

<div class="stage" id="stage">
  <svg id="svg"></svg>
  <div class="hint">
    <b>点击节点</b>折叠 / 展开　·　<b>拖拽</b>平移　·　<b>滚轮</b>缩放　·　<b>点击叶子节点</b>看详情
  </div>
</div>

<div class="aside" id="aside">
  <div class="aside-head">
    <div class="aside-title" id="asideTitle">详情</div>
    <div class="aside-close" onclick="closeAside()">×</div>
  </div>
  <div class="aside-body" id="asideBody"></div>
</div>

            { label: '分三类：全员 / 部分（标出是谁）/ 谁也吃不了' },
            { label: '构造点菜方案（相似度去重，避免两碗面）' },

/* ============================================================================
 * 布局：横向树（根在左）
 * ==========================================================================*/

const COLORS = {
  user: '#2f6df6', admin: '#7a5af8', svc: '#1f9d63', data: '#c98a1b', flow: '#d93a3a'
};

const NODE_H = 30;        // 节点行高
const LEVEL_GAP = 210;    // 层级水平间距
const SIBLING_GAP = 9;    // 同级垂直间距
const PAD_X = 40;
const PAD_Y = 30;

const svg = document.getElementById('svg');
const stage = document.getElementById('stage');

let collapsed = new Set();   // 存放被折叠节点的 id
let layout = [];             // 扁平化的布局结果

/** 给每个节点分配稳定 id 与层级 */
function prepare(node, depth, parentId, branchColor, idx) {
  node._depth = depth;
  node._id = parentId ? parentId + '-' + idx : 'root';
  node._color = branchColor || node.color || null;
  node._children = node.children || [];
  node._children.forEach((c, i) => prepare(c, depth + 1, node._id, node._color, i));
  return node;
}
prepare(TREE, 0, null, null, 0);

/** 把节点文字估算成像素宽度（中文按字号算，英文按 0.55 倍） */
function textWidth(str, size) {
  let w = 0;
  for (const ch of String(str)) {
    w += /[\u4e00-\u9fa5\uff00-\uffef]/.test(ch) ? size : size * 0.56;
  }
  return w;
}

function nodeFontSize(depth) {
  return depth === 0 ? 19 : depth === 1 ? 15 : depth === 2 ? 13 : 12;
}

const BOX_PAD_X = 11;

/** 计算每个节点的盒子宽度 */
function measure(node) {
  const size = nodeFontSize(node._depth);
  let w = textWidth(node.label, size) + BOX_PAD_X * 2;
  if (node.route) w += 0; // 路由不画在节点上，放详情里
  if (node.star) w += 14;
  if (node.badge) w += 8 + textWidth(node.badge, 10) + 10;
  if (node._children.length && node._depth >= 1) w += 16; // 折叠标记
  node._w = Math.round(w);
  node._h = node._depth === 0 ? 42 : NODE_H + (node._depth === 1 ? 8 : 4);
  node._children.forEach(measure);
}
measure(TREE);

/** 横向树布局：先算子树高度，再定位置 */
function layoutTree() {
  layout = [];
  let cursorY = PAD_Y;

  function walk(node, x) {
    const visible = !collapsed.has(node._id);
    const kids = visible ? node._children : [];

    let y;
    const childYs = [];

    if (kids.length) {
      for (const k of kids) childYs.push(walk(k, x + node._w + LEVEL_GAP));
      y = (childYs[0] + childYs[childYs.length - 1]) / 2;
    } else {
      y = cursorY;
      cursorY += node._h + SIBLING_GAP;
    }

    layout.push({ node, x, y, visible, childYs });
    return y;
  }

  walk(TREE, PAD_X);

  // 收集连线
  const links = [];
  for (const item of layout) {
    if (!item.visible) continue;
    const kids = item.node._children;
    kids.forEach((k, i) => {
      const childItem = layout.find((l) => l.node === k);
      if (childItem) {
        links.push({
          from: item,
          to: childItem,
          color: item.node._color || (item.node._depth === 1 ? item.node.color : null)
        });
      }
    });
  }

  return { links, height: cursorY + PAD_Y };
}

/* ============================================================================
 * 渲染
 * ==========================================================================*/

function render() {
  const { links, height } = layoutTree();
  const maxX = Math.max(...layout.map((l) => l.x + l.node._w));
  const width = maxX + PAD_X;

  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  let html = '';

  // 连线：贝塞尔
  for (const l of links) {
    const x1 = l.from.x + l.from.node._w;
    const y1 = l.from.y;
    const x2 = l.to.x;
    const y2 = l.to.y;
    const mx = (x1 + x2) / 2;
    const cls = l.color ? 'link c-' + l.color : 'link';
    html += `<path class="${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" />`;
  }

  // 节点
  for (const item of layout) {
    const n = item.node;
    const x = item.x;
    const y = item.y - n._h / 2;
    const d = n._depth;
    const hasKids = n._children.length > 0;
    const isCollapsed = collapsed.has(n._id);

    let fill = '#fff', stroke = COLORS[n._color] || '#eeece7', strokeW = 1.4, textFill = null;

    if (d === 0) {
      fill = COLORS[n.color] || '#14110f';
      stroke = fill; strokeW = 0;
    } else if (d === 1) {
      fill = '#fff';
      stroke = COLORS[n.color] || '#eeece7';
      strokeW = 1.8;
    } else if (d === 2) {
      fill = '#fff';
      stroke = '#eeece7';
    } else {
      fill = '#fbfaf8';
      stroke = '#f0ede8';
      strokeW = 1;
    }

    const cls = ['node'];
    cls.push('lv' + d);
    const labelCls = 'node-label lv' + d + (hasKids ? '' : ' leaf');

    html += `<g class="${cls.join(' ')}" data-id="${n._id}" transform="translate(${x},${y})">`;
    html += `<rect class="node-box" width="${n._w}" height="${n._h}" rx="${d === 0 ? 11 : 9}"
              fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" />`;

    // 折叠标记
    if (hasKids && d >= 1) {
      html += `<text class="node-toggle" x="${n._w - 9}" y="${n._h / 2}" text-anchor="end">${isCollapsed ? '▸' : '▾'}</text>`;
    }

    // 星标（重点功能）
    let textX = BOX_PAD_X;
    if (n.star) {
      html += `<text class="badge" x="${textX}" y="${n._h / 2}" fill="${COLORS[n._color] || '#ff5a36'}">★</text>`;
      textX += 13;
    }

    const labelFill = d === 0 ? '#fff' : null;
    html += `<text class="${labelCls}" x="${textX}" y="${n._h / 2}"
              ${labelFill ? `fill="${labelFill}"` : ''}>${escapeXml(n.label)}</text>`;

    // tabBadge
    if (n.badge) {
      const bw = textWidth(n.badge, 10) + 12;
      const bx = n._w - bw - 8;
      html += `<rect x="${bx}" y="${n._h / 2 - 8}" width="${bw}" height="16" rx="8"
                fill="${n.badge === 'tab' ? '#ff5a36' : '#eeece7'}" />`;
      html += `<text class="badge" x="${bx + bw / 2}" y="${n._h / 2}" text-anchor="middle"
                fill="${n.badge === 'tab' ? '#fff' : '#4a443f'}">${n.badge === 'tab' ? 'tabBar' : n.badge}</text>`;
    }

    html += '</g>';
  }

  svg.innerHTML = html;

  // 事件
  svg.querySelectorAll('.node').forEach((g) => {
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = g.getAttribute('data-id');
      const item = layout.find((l) => l.node._id === id);
      if (!item) return;
      const n = item.node;
      if (n._children.length) {
        if (collapsed.has(id)) collapsed.delete(id);
        else collapsed.add(id);
        render();
      } else {
        showAside(n);
      }
    });
  });
}

function escapeXml(s) {
  return String(s).replace(/[<>&'"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));
}

/* ============================================================================
 * 缩放与平移
 * ==========================================================================*/

let scale = 1, tx = 0, ty = 0;
let dragging = false, sx = 0, sy = 0;

function applyTransform() {
  svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function fitView() {
  const w = Number(svg.getAttribute('width'));
  const h = Number(svg.getAttribute('height'));
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  scale = Math.min(vw / (w + 60), vh / (h + 60), 1.35);
  tx = 20;
  ty = Math.max(0, (vh - h * scale) / 2);
  applyTransform();
}

stage.addEventListener('mousedown', (e) => {
  dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
  stage.classList.add('grabbing');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  tx = e.clientX - sx; ty = e.clientY - sy; applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; stage.classList.remove('grabbing'); });

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const ns = Math.max(0.2, Math.min(3, scale * factor));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}, { passive: false });

/* ============================================================================
 * 工具栏
 * ==========================================================================*/

function expandAll() { collapsed.clear(); render(); fitView(); }

function collapseAll() {
  collapsed.clear();
  (function walk(n) {
    // 展开根与一级，其余收起来 —— 保证一眼能看到整体骨架
    if (n._depth >= 1 && n._children.length) collapsed.add(n._id);
    n._children.forEach(walk);
  })(TREE);
  render(); fitView();
}

/* ============================================================================
 * 详情抽屉
 * ==========================================================================*/

function showAside(n) {
  document.getElementById('asideTitle').textContent = n.label;
  let html = '';
  if (n.note) html += `<p>${escapeXml(n.note)}</p>`;
  if (n.route) html += `<h4>页面路径</h4><p><code>${escapeXml(n.route)}</code></p>`;
  if (n.flow) html += `<h4>跳转</h4><p>${escapeXml(n.flow)}</p>`;
  if (n.tags) html += `<h4>技术栈</h4><div class="tag-row">${n.tags.map((t) => `<span class="tag">${escapeXml(t)}</span>`).join('')}</div>`;
  if (n._children && n._children.length) {
    html += `<h4>包含（${n._children.length}）</h4><ul>${n._children.map((c) => `<li>${escapeXml(c.label)}</li>`).join('')}</ul>`;
  }
  if (!html) html = '<p>这是一个叶子节点，没有更多说明。</p>';
  document.getElementById('asideBody').innerHTML = html;
  document.getElementById('aside').classList.add('open');
}

function closeAside() { document.getElementById('aside').classList.remove('open'); }

/* ============================================================================
 * 启动
 * ==========================================================================*/

render();
fitView();
window.addEventListener('resize', fitView);
</script>
</body>
